# 本番/検証用: combined image（フロント+バック 1 つ）+ PostgreSQL。
#   ローカルでビルドして起動:   docker compose -f docker-compose.prod.yml up --build
#   CI 済みイメージを使う場合 :   IMAGE=ghcr.io/lxzlocus/kakeibo:latest docker compose -f docker-compose.prod.yml up -d
# 事前に .env（.env.example を参照）で APP_ENCRYPTION_* を設定しておくこと。

services:
  kakeibo-app:
    # CI(GHCR) のイメージを使うなら IMAGE を指定。未指定ならローカルビルド。
    image: ${IMAGE:-kakeibo:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kakeibo-app
    restart: unless-stopped
    ports:
      - "${KAKEIBO_PORT:-3000}:3000"        # フロント（アプリ本体）
      # - "8081:8080"      # バックエンドを直接叩きたい場合のみ公開
    environment:
      # フロント → 同一コンテナ内のバックエンド
      BACKEND_URL: http://127.0.0.1:8080
      # バックエンド → DB（サービス名で解決）
      SPRING_DATASOURCE_URL: "jdbc:postgresql://kakeibo-database:5432/kakeibo"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
      # CORS 許可オリジン。独自ホスト名で公開するなら .env で必ず設定する
      # （未設定だとローカル/LAN内のみ許可で、ホスト名アクセスが 403 Invalid CORS request になる）。
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.*.*.*:*}
      # 保存済み API キーの暗号化キー。変更すると復号できなくなるため固定必須（.env で指定）。
      APP_ENCRYPTION_PASSWORD: ${APP_ENCRYPTION_PASSWORD:?set APP_ENCRYPTION_PASSWORD in .env}
      APP_ENCRYPTION_SALT: ${APP_ENCRYPTION_SALT:?set APP_ENCRYPTION_SALT in .env}
      # アクセスゲート（Next.js middleware の Basic 認証）。両方セットで有効化。
      # 外部公開時は .env で必ず設定すること（未設定なら誰でもアクセス可）。
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      JAVA_OPTS: -Xmx512m -Xms256m
    depends_on:
      kakeibo-database:
        condition: service_healthy

  kakeibo-database:
    image: postgres:16-alpine
    container_name: kakeibo-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: kakeibo
    # スキーマは Spring Boot 起動時に Flyway が作成する。
    # DBデータは compose と同じ場所の ./data/postgres に永続化。
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kakeibo"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
