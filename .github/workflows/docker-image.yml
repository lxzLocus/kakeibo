name: Build and push Docker image

# combined image（フロント+バック 1 つ）をビルドし、GHCR (ghcr.io) に push する。
#   - master への push / v* タグ / 手動実行 で push
#   - PR ではビルド検証のみ（push しない）
on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 例: lxzLocus/kakeibo -> ghcr.io/lxzlocus/kakeibo（metadata-action が小文字化する）
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # PR ではレジストリにログインしない（push しないため）
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action は OCI ラベルを埋めるために GitHub API を叩くが、
      # その応答が HTML(500) で返ってきてビルドが恒常的に失敗するようになったため使わない。
      # （このリポジトリは description も license も未設定で、API から得る情報は実質ゼロ）
      # タグ/ラベルは API に依存せず、ここで決定論的に組み立てる。
      #   - 常に          : sha-<短縮SHA>
      #   - ブランチpush  : <ブランチ名>（既定ブランチなら latest も）
      #   - v* タグpush   : <version> と <major>.<minor>
      #   - PR            : pr-<番号>（PRでは push しないのでビルド検証用）
      - name: Extract metadata (tags, labels)
        id: meta
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
        run: |
          set -euo pipefail
          image="$(printf '%s/%s' "$REGISTRY" "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          tags=("${image}:sha-${GITHUB_SHA::7}")

          case "$GITHUB_REF" in
            refs/heads/*)
              branch="${GITHUB_REF#refs/heads/}"
              tags+=("${image}:${branch//\//-}")
              if [ "$branch" = "$DEFAULT_BRANCH" ]; then tags+=("${image}:latest"); fi
              ;;
            refs/tags/v*)
              version="${GITHUB_REF#refs/tags/v}"
              tags+=("${image}:${version}")
              tags+=("${image}:$(printf '%s' "$version" | cut -d. -f1,2)")
              ;;
            refs/pull/*)
              pr="${GITHUB_REF#refs/pull/}"
              tags+=("${image}:pr-${pr%%/*}")
              ;;
          esac

          {
            echo 'tags<<__META_EOF__'
            printf '%s\n' "${tags[@]}"
            echo '__META_EOF__'
            echo 'labels<<__META_EOF__'
            echo "org.opencontainers.image.title=${GITHUB_REPOSITORY#*/}"
            echo "org.opencontainers.image.url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '__META_EOF__'
          } >> "$GITHUB_OUTPUT"

          printf 'resolved tags:\n'; printf '  %s\n' "${tags[@]}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # PR は検証のみ、それ以外は push
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # arm64 も出す場合は下行を linux/amd64,linux/arm64 に（QEMU ビルドで時間はかかる）
          platforms: linux/amd64
