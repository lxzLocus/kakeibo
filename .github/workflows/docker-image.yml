name: Build and push Docker image

# combined image（フロント+バック 1 つ）をビルドし、GHCR (ghcr.io) に push する。
#   - master への push / v* タグ / 手動実行 で push
#   - PR ではビルド検証のみ（push しない）
on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 例: lxzLocus/kakeibo -> ghcr.io/lxzlocus/kakeibo（metadata-action が小文字化する）
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # PR ではレジストリにログインしない（push しないため）
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 注: このステップは OCI ラベル用に GitHub API (GET /repos/...) を叩くため、
      #     GitHub 側の一時的な 5xx で落ちることがある（その場合は再実行で復旧する）。
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # PR は検証のみ、それ以外は push
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # arm64 も出す場合は下行を linux/amd64,linux/arm64 に（QEMU ビルドで時間はかかる）
          platforms: linux/amd64
