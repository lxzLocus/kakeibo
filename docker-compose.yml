services:
  kakeibo-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kakeibo-frontend
    tty: true
    ports:
      - "3000:3000" 
    volumes:
      - /app/node_modules
      - type: bind
        source: ./frontend
        target: /app
    environment:
      - BACKEND_URL=http://kakeibo-backend:8080
  kakeibo-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kakeibo-backend
    tty: true
    ports:
      # ホスト側8080が別サービスで使用中のため8081に変更（コンテナ間通信はkakeibo-backend:8080のまま）
      - "8081:8080"
    volumes:
      - type: bind
        source: ./backend
        target: /app
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m


  kakeibo-database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: kakeibo-database
    restart: unless-stopped
    tty: true
    # 開発用のMySQLチューニング: コミット毎のfsyncをやめて書き込みを高速化
    # （Docker Desktop/Windowsのディスクfsyncが遅く、INSERTが数秒かかるため）
    command:
      - --innodb-flush-log-at-trx-commit=2
      - --sync-binlog=0
    ports:
      # ホスト側3306が別サービスで使用中のため3307に変更（コンテナ間通信はkakeibo-database:3306のまま）
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: kakeibo
    volumes:
      - ./database/init/init.sql:/docker-entrypoint-initdb.d/init.sql

