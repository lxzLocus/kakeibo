services:
  kakeibo-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kakeibo-frontend
    tty: true
    ports:
      - "3000:3000" 
    volumes:
      - /app/node_modules
      - type: bind
        source: ./frontend
        target: /app
    environment:
      - BACKEND_URL=http://kakeibo-backend:8080
  kakeibo-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kakeibo-backend
    tty: true
    ports:
      # ホスト側8080が別サービスで使用中のため8081に変更（コンテナ間通信はkakeibo-backend:8080のまま）
      - "8081:8080"
    volumes:
      - type: bind
        source: ./backend
        target: /app
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      # DBパスワードは DB サービスと同期（.env の DB_PASSWORD があれば使用、無ければ password）
      - SPRING_DATASOURCE_URL=jdbc:postgresql://kakeibo-database:5432/kakeibo
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password}


  kakeibo-database:
    image: postgres:16-alpine
    container_name: kakeibo-database
    restart: unless-stopped
    tty: true
    ports:
      # ホスト側5432が別サービスで使用中のため5433に変更（コンテナ間通信はkakeibo-database:5432のまま）
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: kakeibo
    # スキーマは Spring Boot 起動時に Flyway が作成する。
    # 開発は Windows/Docker Desktop のバインドマウントが遅いため named volume を使う。
    volumes:
      - kakeibo-db-data:/var/lib/postgresql/data

volumes:
  kakeibo-db-data: