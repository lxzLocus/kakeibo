; 家計簿 combined image 用 supervisor 設定。
; backend(Spring Boot) と frontend(Next.js) を 1 コンテナで同時に起動する。
; ログはコンテナの標準出力へ流し、`docker logs` で両方見えるようにする。

[supervisord]
nodaemon=true
user=root
loglevel=info
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:backend]
; JAVA_OPTS を展開するため sh 経由。exec で java を PID 継承させ SIGTERM を受け取れるように。
command=/bin/sh -c "exec java $JAVA_OPTS -jar /app/backend/app.jar"
directory=/app/backend
autostart=true
; DB 起動待ちなどで落ちても粘り強く再起動する
autorestart=true
startretries=20
startsecs=10
stopwaitsecs=30
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=/bin/sh -c "exec node /app/frontend/server.js"
directory=/app/frontend
autostart=true
autorestart=true
startretries=20
startsecs=5
stopwaitsecs=15
priority=20
environment=PORT="3000",HOSTNAME="0.0.0.0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
