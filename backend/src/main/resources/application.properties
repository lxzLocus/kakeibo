spring.application.name=kakeibo

# データベース接続設定
spring.datasource.url=jdbc:mysql://kakeibo-database:3306/kakeibo?serverTimezone=Asia/Tokyo
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.sql-script-encoding=utf-8

# マルチパート（レシート画像アップロード）設定
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.file-size-threshold=2MB

# APIキー暗号化設定（本番では必ずenvで上書きすること）
app.encryption.password=${APP_ENCRYPTION_PASSWORD:dev-change-me-please}
app.encryption.salt=${APP_ENCRYPTION_SALT:5c0744940b5c369b}

# JPA/Hibernate設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo
spring.jpa.show-sql=true

# アプリケーションログ設定
logging.level.com.study.kakeibo.controller=INFO
logging.level.com.study.kakeibo.service=DEBUG
logging.level.com.study.kakeibo.repository=DEBUG
logging.level.com.study.kakeibo.aspect=DEBUG
logging.level.com.study.kakeibo.exception=WARN

# Spring Frameworkログ
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
